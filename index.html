        ];

        // --- DOM Elements ---
        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
        const toggleSidebarBtnMobile = document.getElementById('toggle-sidebar-btn-mobile');
        const mobileOverlay = document.getElementById('mobile-overlay');
        const newChatBtn = document.getElementById('new-chat-btn');
        const chatHistoryEl = document.getElementById('chat-history');
        const clearChatsBtn = document.getElementById('clear-chats-btn');

        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeView = document.getElementById('welcome-view');
        const messagesList = document.getElementById('messages-list');
        const chatContainer = document.getElementById('chat-container');

        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const settingsTopBtn = document.getElementById('settings-top-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modeBadge = document.getElementById('mode-badge');
        const languageSelect = document.getElementById('language-select');
        const themeSelect = document.getElementById('theme-select');

        // --- Initializers ---
        window.addEventListener('DOMContentLoaded', () => {
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true
            });

            updateApiModeUI();
            renderChatHistory();
            setupEventListeners();
            autoResizeInput();
        });

        // --- Sidebar & Navigation Setup ---
        function setupEventListeners() {
            // Sidebar Toggles
            const toggleSidebar = () => {
                sidebar.classList.toggle('-translate-x-full');
                mobileOverlay.classList.toggle('hidden');
            };
            toggleSidebarBtn.addEventListener('click', toggleSidebar);
            toggleSidebarBtnMobile.addEventListener('click', toggleSidebar);
            mobileOverlay.addEventListener('click', toggleSidebar);

            // Settings Modal
            const openSettings = () => {
                languageSelect.value = localStorage.getItem('negm_language') || 'en';
                themeSelect.value = 'dark';
                settingsModal.classList.remove('hidden');
            };
            openSettingsBtn.addEventListener('click', openSettings);
            settingsTopBtn.addEventListener('click', openSettings);
            closeModalBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

            languageSelect.addEventListener('change', () => {
                localStorage.setItem('negm_language', languageSelect.value);
                applyLanguage(languageSelect.value);
            });

            themeSelect.addEventListener('change', () => {
                document.documentElement.classList.add('dark');
            });

            // Input Resize & Send triggers
            userInput.addEventListener('input', () => {
                autoResizeInput();
                toggleSendButton();
            });

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!state.isGenerating && userInput.value.trim()) {
                        handleSendMessage();
                    }
                }
            });

            sendBtn.addEventListener('click', () => {
                if (!state.isGenerating && userInput.value.trim()) {
                    handleSendMessage();
                }
            });

            newChatBtn.addEventListener('click', startNewChat);

            clearChatsBtn.addEventListener('click', () => {
                state.chats = [];
                localStorage.removeItem('gemini_chats_history');
                startNewChat();
                renderChatHistory();
            });

            // Suggestion Cards click handler
            document.querySelectorAll('.prompt-card').forEach(card => {
                card.addEventListener('click', () => {
                    const text = card.querySelector('p').innerText;
                    userInput.value = text;
                    autoResizeInput();
                    toggleSendButton();
                    handleSendMessage();
                });
            });
        }

        // Auto-expand input textarea
        function autoResizeInput() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
        }

        function toggleSendButton() {
            const hasValue = userInput.value.trim().length > 0;
            sendBtn.disabled = !hasValue || state.isGenerating;
            if (hasValue && !state.isGenerating) {
                sendBtn.classList.remove('bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
                sendBtn.classList.add('bg-white', 'text-black', 'hover:bg-gray-200');
            } else {
                sendBtn.classList.add('bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
                sendBtn.classList.remove('bg-white', 'text-black', 'hover:bg-gray-200');
            }
        }

        // --- Mode Update UI ---
        function updateApiModeUI() {
            if (state.apiKey) {
                modeBadge.innerText = 'Live API';
                modeBadge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20';
            } else {
                modeBadge.innerText = 'Demo Mode';
                modeBadge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
            }
        }

        // --- Chat Lifecycle ---
        function startNewChat() {
            state.currentChatId = null;
            welcomeView.classList.remove('hidden');
            messagesList.classList.add('hidden');
            messagesList.innerHTML = '';
            userInput.value = '';
            autoResizeInput();
            toggleSendButton();
            renderChatHistory();
        }

        function loadChat(chatId) {
            const chat = state.chats.find(c => c.id === chatId);
            if (!chat) return;

            state.currentChatId = chat.id;
            welcomeView.classList.add('hidden');
            messagesList.classList.remove('hidden');
            messagesList.innerHTML = '';

            chat.messages.forEach(msg => appendMessageUI(msg.role, msg.text));
            renderChatHistory();
            scrollToBottom();
        }

        function renderChatHistory() {
            chatHistoryEl.innerHTML = '';
            state.chats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl text-sm flex items-center gap-3 transition group ${
                    isActive ? 'bg-[#282a2c] text-white font-medium' : 'text-gray-400 hover:bg-[#1e1f20] hover:text-gray-200'
                }`;
                
                btn.innerHTML = `
                    <i class="fa-regular fa-message text-xs ${isActive ? 'text-gemini-blue' : 'text-gray-500'}"></i>
                    <span class="truncate flex-1">${escapeHtml(chat.title)}</span>
                `;
                btn.onclick = () => loadChat(chat.id);
                chatHistoryEl.appendChild(btn);
            });
        }

        // --- Messaging & Generation ---
        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text || state.isGenerating) return;

            userInput.value = '';
            autoResizeInput();
            toggleSendButton();

            // Setup active chat object if new
            if (!state.currentChatId) {
                const newChat = {
                    id: Date.now().toString(),
                    title: text.slice(0, 30) + (text.length > 30 ? '...' : ''),
                    messages: []
                };
                state.chats.unshift(newChat);
                state.currentChatId = newChat.id;
            }

            const currentChat = state.chats.find(c => c.id === state.currentChatId);
            
            // Push User Message
            currentChat.messages.push({ role: 'user', text });
            saveChatsToStorage();
            
            welcomeView.classList.add('hidden');
            messagesList.classList.remove('hidden');
            appendMessageUI('user', text);
            scrollToBottom();

            // Prepare Assistant Placeholder
            state.isGenerating = true;
            toggleSendButton();
            const assistantBubble = appendMessageUI('assistant', '', true);
            scrollToBottom();

            // Fetch or Simulate Response
            if (state.apiKey) {
                await fetchLiveGeminiResponse(currentChat, assistantBubble);
            } else {
                await simulateDemoResponse(assistantBubble, currentChat);
            }

            state.isGenerating = false;
            toggleSendButton();
            saveChatsToStorage();
            renderChatHistory();
        }

        // --- Simulated Streaming Response ---
        async function simulateDemoResponse(bubbleEl, currentChat) {
            const randomResponse = mockResponses[Math.floor(Math.random() * mockResponses.length)];
            let currentText = "";
            const contentEl = bubbleEl.querySelector('.message-content');
            
            contentEl.classList.add('typing-cursor');

            for (let i = 0; i < randomResponse.length; i++) {
                currentText += randomResponse[i];
                contentEl.innerHTML = marked.parse(currentText);
                if (i % 5 === 0) scrollToBottom();
                await new Promise(res => setTimeout(res, 15));
            }

            contentEl.classList.remove('typing-cursor');
            currentChat.messages.push({ role: 'assistant', text: randomResponse });
            addCodeCopyButtons(bubbleEl);
        }

        // --- Real Google Gemini API Call ---
        async function fetchLiveGeminiResponse(currentChat, bubbleEl) {
            const contentEl = bubbleEl.querySelector('.message-content');
            contentEl.classList.add('typing-cursor');

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${state.apiKey}`;

            // Format history for Gemini API
            const contentsPayload = currentChat.messages.map(m => ({
                role: m.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: m.text }]
            }));

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contentsPayload })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response text received.";

                contentEl.classList.remove('typing-cursor');
                contentEl.innerHTML = marked.parse(responseText);
                currentChat.messages.push({ role: 'assistant', text: responseText });
                addCodeCopyButtons(bubbleEl);

            } catch (err) {
                contentEl.classList.remove('typing-cursor');
                const errorMsg = `⚠️ **Error connecting to Gemini API:** ${err.message}. Please check the Gemini API connection.`;
                contentEl.innerHTML = marked.parse(errorMsg);
                currentChat.messages.push({ role: 'assistant', text: errorMsg });
            }
        }

        // --- UI Rendering Helpers ---
        function appendMessageUI(role, text, isPlaceholder = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 ${role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;

            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="max-w-[85%] bg-gemini-userBubble text-gray-100 px-5 py-3 rounded-2xl rounded-tr-none text-base border border-gray-700/40">
                        ${escapeHtml(text)}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gemini-gradient flex-shrink-0 flex items-center justify-center text-white text-xs mt-1 sparkle-glow">
                        <i class="fa-solid fa-sparkles"></i>
                    </div>
                    <div class="max-w-[90%] flex-1 space-y-2">
                        <div class="message-content prose text-gray-200 text-base leading-relaxed">
                            ${text ? marked.parse(text) : '<span class="text-gray-500 animate-pulse">Thinking...</span>'}
                        </div>
                        
                        <!-- Action Bar -->
                        <div class="flex items-center gap-2 pt-2 text-gray-400 text-xs">
                            <button class="action-btn hover:text-white p-1.5 rounded hover:bg-gray-800 transition" title="Copy response" onclick="copyText(this)">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                            <button class="action-btn hover:text-white p-1.5 rounded hover:bg-gray-800 transition" title="Good response">
                                <i class="fa-regular fa-thumbs-up"></i>
                            </button>
                            <button class="action-btn hover:text-white p-1.5 rounded hover:bg-gray-800 transition" title="Bad response">
                                <i class="fa-regular fa-thumbs-down"></i>
                            </button>
                        </div>
                    </div>
                `;
            }

            messagesList.appendChild(wrapper);
            if (!isPlaceholder) addCodeCopyButtons(wrapper);
            return wrapper;
        }

        function addCodeCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-code-btn')) return;
                
                const btn = document.createElement('button');
                btn.className = 'copy-code-btn absolute top-2 right-2 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded border border-gray-600 transition flex items-center gap-1';
                btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`;
                
                pre.style.position = 'relative';
                pre.appendChild(btn);

                btn.onclick = () => {
                    const code = pre.querySelector('code')?.innerText || pre.innerText;
                    navigator.clipboard.writeText(code);
                    btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Copied!`;
                    setTimeout(() => {
                        btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`;
                    }, 2000);
                };
            });
        }

        // --- Voice input, file attachments, and real language switching ---
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const micBtn = document.getElementById('mic-btn');
        let speechRecognition = null;

        const translations = {
            en: {
                newChat:'New chat', recent:'Recent', settings:'Settings', clearConversations:'Clear conversations',
                hello:'Hello, Friend', welcomeQuestion:'How can I help you today?', language:'Language', appearance:'Appearance',
                dark:'Dark', settingsSubtitle:'Customize your negm AI experience', about:'About negm AI',
                savedLocally:'Your conversations are saved locally in this browser.',
                disclaimer:'Gemini may display inaccurate info, including about people, so double-check its responses.',
                message:'Message negm AI...', attached:'Attached file: '
            },
            ar: {
                newChat:'محادثة جديدة', recent:'الأخيرة', settings:'الإعدادات', clearConversations:'مسح المحادثات',
                hello:'مرحبًا يا صديقي', welcomeQuestion:'كيف يمكنني مساعدتك اليوم؟', language:'اللغة', appearance:'المظهر',
                dark:'داكن', settingsSubtitle:'خصّص تجربة negm AI الخاصة بك', about:'حول negm AI',
                savedLocally:'يتم حفظ محادثاتك محليًا في هذا المتصفح.',
                disclaimer:'قد يعرض Gemini معلومات غير دقيقة، لذا يُرجى التحقق من إجاباته.',
                message:'أرسل رسالة إلى negm AI...', attached:'الملف المرفق: '
            }
        };

        function applyLanguage(lang) {
            const t = translations[lang] || translations.en;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.textContent = t[key];
            });
            userInput.placeholder = t.message;
            localStorage.setItem('negm_language', lang);
            if (languageSelect) languageSelect.value = lang;
        }

        function setupVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Voice input is not supported in this browser. Try Chrome or Edge.');
                return;
            }
            if (speechRecognition) {
                speechRecognition.stop();
                speechRecognition = null;
                micBtn.classList.remove('text-red-400');
                return;
            }
            speechRecognition = new SpeechRecognition();
            speechRecognition.lang = (localStorage.getItem('negm_language') || 'en') === 'ar' ? 'ar-SA' : 'en-US';
            speechRecognition.interimResults = false;
            speechRecognition.onstart = () => micBtn.classList.add('text-red-400');
            speechRecognition.onresult = event => {
                userInput.value = `${userInput.value} ${event.results[0][0].transcript}`.trim();
                autoResizeInput();
                toggleSendButton();
            };
            speechRecognition.onerror = () => {};
            speechRecognition.onend = () => {
                micBtn.classList.remove('text-red-400');
                speechRecognition = null;
            };
            speechRecognition.start();
        }

        function setupFileAttachment() {
            fileInput.click();
        }

        fileInput.addEventListener('change', async () => {
            const file = fileInput.files?.[0];
            if (!file) return;
            if (file.type.startsWith('text/') || /\.(txt|md|csv|json|js|html|css|py)$/i.test(file.name)) {
                const content = await file.text();
                const lang = localStorage.getItem('negm_language') || 'en';
                const prefix = translations[lang].attached;
                userInput.value = `${userInput.value}\n\n${prefix}${file.name}\n${content}`.trim();
            } else {
                const lang = localStorage.getItem('negm_language') || 'en';
                const prefix = translations[lang].attached;
                userInput.value = `${userInput.value} [${prefix}${file.name}]`.trim();
            }
            autoResizeInput();
            toggleSendButton();
            fileInput.value = '';
        });

        uploadBtn.addEventListener('click', setupFileAttachment);
        micBtn.addEventListener('click', setupVoiceInput);
        applyLanguage(localStorage.getItem('negm_language') || 'en');

        // --- Utilities ---
        function copyText(btn) {
            const messageText = btn.closest('.space-y-2').querySelector('.message-content').innerText;
            navigator.clipboard.writeText(messageText);
            const icon = btn.querySelector('i');
            icon.className = 'fa-solid fa-check text-emerald-400';
            setTimeout(() => {
                icon.className = 'fa-regular fa-copy';
            }, 2000);
        }

        function saveChatsToStorage() {
            localStorage.setItem('gemini_chats_history', JSON.stringify(state.chats));
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
